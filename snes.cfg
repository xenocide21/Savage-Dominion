# LoROM layout: 4 x 32 KB banks to start (grows as content is added)
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw;
    RAM:    start = $0200, size = $1C00, type = rw;      # low WRAM ($0000-$1FFF mirror)
    RAM7E:  start = $7E2000, size = $E000, type = rw;
    ROM0:   start = $808000, size = $8000, fill = yes, fillval = $FF, file = %O;
    ROM1:   start = $818000, size = $8000, fill = yes, fillval = $FF, file = %O;
    ROM2:   start = $828000, size = $8000, fill = yes, fillval = $FF, file = %O;
    ROM3:   start = $838000, size = $8000, fill = yes, fillval = $FF, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    BSS:      load = RAM,  type = bss;
    BSS7E:    load = RAM7E, type = bss, optional = yes;
    CODE:     load = ROM0, start = $808000;
    RODATA:   load = ROM0;
    HEADER:   load = ROM0, start = $80FFC0;
    VECTORS:  load = ROM0, start = $80FFE0;
    BANK1:    load = ROM1, optional = yes;
    BANK2:    load = ROM2, optional = yes;
    BANK3:    load = ROM3, optional = yes;
}
